[workspace]
resolver = "2"
members = ["contract", "config", "compositor", "clipboard", "harness", "shell", "settings", "notifications", "ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
zbus = "5"
redb = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
image = "0.25"

# Dependencies are optimised even in the dev profile: skia-rs (pure-Rust
# rasteriser) at opt-level 0 paints a settings-window frame in ~18 s, which
# turned the harness-driven gates into minutes-long waits (M5 P2-D19). Workspace
# crates keep opt-level 0 for fast rebuilds and debuggability; only the
# dependency graph is optimised, and only once per target dir.
[profile.dev.package."*"]
opt-level = 2

# M7 pointer/cursor/touch batch (Task 4): consume the wlr-m7-pointer
# worktree's unpublished API (CursorState/TouchState/SwitchState snapshots,
# PointerFrame/TouchFrame/GesturePhase tokens, constraint/gesture/touch/
# switch events) ahead of the wlr 0.20.34 publish. Mirrors the B6/M8
# pre-publish patches. DROP at B-FINAL: remove this section and pin
# `wlr = "0.20.34"` in compositor/Cargo.toml once the release is published.
[patch.crates-io]
wlr = { path = "/home/joseph/Projects/wlroots-sys/.worktrees/wlr-m7-pointer/crates/wlr" }

